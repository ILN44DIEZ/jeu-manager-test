name: Deploy Manager Career to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test calendar generation
        run: |
          node --check game/calendar.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");

          const source = fs.readFileSync("game/calendar.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__CalendarForTests = ChampionshipCalendar;");
          const Calendar = globalThis.__CalendarForTests;
          const clubs = JSON.parse(fs.readFileSync("data/clubs.json", "utf8"));
          const leagues = new Map();

          for (const club of clubs) {
            if (!leagues.has(club.ligue)) leagues.set(club.ligue, []);
            leagues.get(club.ligue).push(club.nom);
          }

          const expected = {
            "Premier League": { teams: 20, days: 38, matches: 380 },
            "Liga": { teams: 19, days: 38, matches: 342 },
            "Serie A": { teams: 20, days: 38, matches: 380 },
            "Bundesliga": { teams: 18, days: 34, matches: 306 },
            "Ligue 1": { teams: 20, days: 38, matches: 380 }
          };

          for (const [name, spec] of Object.entries(expected)) {
            const teams = leagues.get(name);
            if (!teams || teams.length !== spec.teams) {
              throw new Error(name + ": nombre d'équipes inattendu");
            }

            for (let trial = 1; trial <= 5; trial++) {
              const calendar = new Calendar(teams, "2026-08-15");
              calendar.generateFullCalendar();
              const validation = calendar.validateCalendar();
              if (!validation.valid) {
                throw new Error(name + " essai " + trial + ": " + validation.errors.join(" | "));
              }
              if (calendar.matchdays.length !== spec.days ||
                  validation.summary.matches !== spec.matches) {
                throw new Error(name + ": nombre de journées ou de matchs incorrect");
              }
            }

            console.log("OK — " + name + " : " + spec.days +
              " journées, " + spec.matches + " matchs, 5 générations validées.");
          }
          NODE

      - name: Generate build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the GitHub Pages deployment run number for this exact commit.
          for attempt in {1..10}; do
            PAGES_BUILD=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" | jq -r --arg sha "${GITHUB_SHA}" '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha)] | first | .run_number // empty')
            if [ -n "${PAGES_BUILD}" ]; then break; fi
            sleep 2
          done
          # Fallback only if GitHub has not exposed the Pages run yet.
          BUILD_NUMBER="${PAGES_BUILD:-${GITHUB_RUN_NUMBER}}"
          printf 'window.MANAGER_BUILD_NUMBER = "%s";\n' "${BUILD_NUMBER}" > build-version.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
