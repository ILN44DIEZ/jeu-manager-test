name: Deploy Manager Career to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test calendar generation
        run: |
          node --check game/calendar.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");

          const source = fs.readFileSync("game/calendar.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__CalendarForTests = ChampionshipCalendar;");
          const Calendar = globalThis.__CalendarForTests;
          const clubs = JSON.parse(fs.readFileSync("data/clubs.json", "utf8"));
          const leagues = new Map();

          for (const club of clubs) {
            if (!leagues.has(club.ligue)) leagues.set(club.ligue, []);
            leagues.get(club.ligue).push(club.nom);
          }

          const expected = {
            "Premier League": { teams: 20, days: 38, matches: 380 },
            "Liga": { teams: 19, days: 38, matches: 342 },
            "Serie A": { teams: 20, days: 38, matches: 380 },
            "Bundesliga": { teams: 18, days: 34, matches: 306 },
            "Ligue 1": { teams: 20, days: 38, matches: 380 }
          };

          for (const [name, spec] of Object.entries(expected)) {
            const teams = leagues.get(name);
            if (!teams || teams.length !== spec.teams) {
              throw new Error(name + ": nombre d'équipes inattendu");
            }

            for (let trial = 1; trial <= 5; trial++) {
              const calendar = new Calendar(teams, "2026-08-15");
              calendar.generateFullCalendar();
              const validation = calendar.validateCalendar();
              if (!validation.valid) {
                throw new Error(name + " essai " + trial + ": " + validation.errors.join(" | "));
              }
              if (calendar.matchdays.length !== spec.days ||
                  validation.summary.matches !== spec.matches) {
                throw new Error(name + ": nombre de journées ou de matchs incorrect");
              }
            }

            console.log("OK — " + name + " : " + spec.days +
              " journées, " + spec.matches + " matchs, 5 générations validées.");
          }
          NODE

      - name: Test match simulation
        run: |
          node --check matches.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const source = fs.readFileSync("matches.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__MatchEngineForTests = MatchEngine;");
          const MatchEngineForTests = globalThis.__MatchEngineForTests;

          const makePlayers = (prefix) => Array.from({ length: 15 }, (_, i) => ({
            id: prefix + "-" + i,
            prenom: prefix + "Joueur",
            nom: String(i + 1),
            poste: i === 0 ? "GB" : i < 5 ? "DC" : i < 10 ? "MC" : "BU",
            note: 60 + (i % 30),
            age: 20 + (i % 12),
            butsSaison: 0,
            passesDecisivesSaison: 0,
            fatigue: 20,
            joursBlessure: 0,
            blessure: ""
          }));

          const homeSquad = makePlayers("HOME");
          const awaySquad = makePlayers("AWAY");
          const engine = new MatchEngineForTests();
          engine.setSquads({ Home: homeSquad, Away: awaySquad });
          engine.setActiveLineup("Home", homeSquad.slice(0, 11));
          engine.setActiveLineup("Away", awaySquad.slice(0, 11));

          for (let trial = 1; trial <= 100; trial++) {
            const result = engine.simulateMatch("Home", "Away");
            if (!Number.isInteger(result.homeGoals) || result.homeGoals < 0 ||
                !Number.isInteger(result.awayGoals) || result.awayGoals < 0) {
              throw new Error("Score invalide à l'essai " + trial);
            }
            if (result.events.length !== result.homeGoals + result.awayGoals) {
              throw new Error("Nombre d'événements différent du score à l'essai " + trial);
            }
            const minutes = result.events.map(event => event.minute);
            if (new Set(minutes).size !== minutes.length ||
                minutes.some(minute => !Number.isInteger(minute) || minute < 1 || minute > 90)) {
              throw new Error("Minute de but invalide ou dupliquée à l'essai " + trial);
            }
            let homeScore = 0;
            let awayScore = 0;
            for (const event of result.events) {
              if (event.team === "Home") homeScore++;
              else if (event.team === "Away") awayScore++;
              else throw new Error("Équipe inconnue dans un événement de but");
              if (!event.scorer) throw new Error("Buteur absent");
              const allowed = event.team === "Home" ? homeSquad.slice(0, 11) : awaySquad.slice(0, 11);
              if (!allowed.some(player => player.prenom + " " + player.nom === event.scorer)) {
                throw new Error("Buteur absent du onze actif");
              }
              if (event.assist && event.assist === event.scorer) {
                throw new Error("Un joueur ne peut pas faire la passe décisive de son propre but");
              }
              if (event.score !== homeScore + " - " + awayScore) {
                throw new Error("Score intermédiaire incohérent");
              }
            }
            if (homeScore !== result.homeGoals || awayScore !== result.awayGoals) {
              throw new Error("Score final incohérent avec les événements");
            }
          }

          const matchday = {
            day: 1,
            played: false,
            matches: [{ home: "Home", away: "Away", played: false, result: null }],
            results: []
          };
          const first = engine.simulateMatchday(matchday);
          const historyLength = engine.history.length;
          const second = engine.simulateMatchday(matchday);
          if (first[0].homeGoals !== second[0].homeGoals ||
              first[0].awayGoals !== second[0].awayGoals ||
              engine.history.length !== historyLength) {
            throw new Error("Une journée déjà jouée a été simulée une deuxième fois");
          }

          console.log("OK — 100 simulations de matchs et test anti-double simulation.");
          NODE

      - name: Test standings integrity
        run: |
          node --check standings.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const source = fs.readFileSync("standings.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__StandingsForTests = Standings;");
          const StandingsForTests = globalThis.__StandingsForTests;
          const table = new StandingsForTests(["A", "B", "C"]);

          if (table.update({ homeTeam: "A", awayTeam: "B", homeGoals: 2, awayGoals: 0 }) !== true) {
            throw new Error("Un résultat valide a été refusé");
          }
          if (table.update({ homeTeam: "B", awayTeam: "C", homeGoals: 1, awayGoals: 1 }) !== true) {
            throw new Error("Un match nul valide a été refusé");
          }
          if (table.update({ homeTeam: "C", awayTeam: "A", homeGoals: 3, awayGoals: 1 }) !== true) {
            throw new Error("Une victoire extérieure valide a été refusée");
          }

          const a = table.getTeam("A");
          const b = table.getTeam("B");
          const c = table.getTeam("C");
          if (a.played !== 2 || a.points !== 3 || a.goalsFor !== 3 || a.goalsAgainst !== 3) {
            throw new Error("Statistiques de A incorrectes");
          }
          if (b.played !== 2 || b.points !== 1 || b.draws !== 1 || b.losses !== 1) {
            throw new Error("Statistiques de B incorrectes");
          }
          if (c.played !== 2 || c.points !== 4 || c.wins !== 1 || c.draws !== 1) {
            throw new Error("Statistiques de C incorrectes");
          }

          const before = JSON.stringify(table.getTable());
          const invalid = [
            null,
            {},
            { homeTeam: "A", awayTeam: "A", homeGoals: 1, awayGoals: 0 },
            { homeTeam: "A", awayTeam: "B", homeGoals: -1, awayGoals: 0 },
            { homeTeam: "A", awayTeam: "B", homeGoals: 1.5, awayGoals: 0 },
            { homeTeam: "Unknown", awayTeam: "B", homeGoals: 1, awayGoals: 0 }
          ];
          for (const result of invalid) {
            if (table.update(result) !== false) {
              throw new Error("Un résultat invalide a été accepté");
            }
          }
          if (JSON.stringify(table.getTable()) !== before) {
            throw new Error("Le classement a changé après un résultat invalide");
          }

          for (let i = 0; i < 7; i++) {
            table.update({ homeTeam: "A", awayTeam: "B", homeGoals: 1, awayGoals: 0 });
          }
          if (table.getTeam("A").form.length !== 5 || table.getTeam("B").form.length !== 5) {
            throw new Error("La forme doit être limitée aux cinq derniers matchs");
          }

          console.log("OK — classement, points, différence de buts, forme et rejets d'entrées invalides.");
          NODE

      - name: Test player and club data integrity
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clubs = JSON.parse(fs.readFileSync("data/clubs.json", "utf8"));
          const players = JSON.parse(fs.readFileSync("data/players.json", "utf8"));
          if (!Array.isArray(clubs) || !Array.isArray(players)) {
            throw new Error("Les fichiers de clubs et de joueurs doivent contenir des listes.");
          }

          const clubNames = clubs.map(club => club.nom);
          if (clubNames.some(name => !name) || new Set(clubNames).size !== clubNames.length) {
            throw new Error("Nom de club absent ou dupliqué.");
          }
          const knownClubs = new Set(clubNames);
          const unlinkedPlayers = players.filter(player => !player.club || !knownClubs.has(player.club));
          if (unlinkedPlayers.length) {
            throw new Error(unlinkedPlayers.length + " joueur(s) lié(s) à un club absent de clubs.json : " +
              unlinkedPlayers.slice(0, 10).map(player => (player.prenom || "") + " " +
                (player.nom || "") + " [" + (player.club || "club absent") + "]").join(", "));
          }

          const requiredFields = [
            "prenom", "nom", "club", "poste", "age", "nationalite",
            "taille", "poids", "numero", "pied", "note", "potentiel",
            "forme", "moral", "fatigue", "blessure", "joursBlessure",
            "valeur", "salaire", "contratFin", "role", "experience",
            "cartonsJaunes", "cartonsRouges", "buts", "passes",
            "matchs", "minutes", "cleanSheets", "centreFormation",
            "retraite", "pret", "clubPret", "suspendu", "joursSuspension"
          ];
          const incomplete = players.filter(player =>
            requiredFields.some(field => !Object.prototype.hasOwnProperty.call(player, field))
          );
          const validPositions = new Set([
            "GB", "G", "DD", "DG", "DC", "DCD", "DCG", "MDC",
            "MC", "MOC", "MD", "MG", "AD", "AG", "BU"
          ]);
          const invalidPositions = players.filter(player => !validPositions.has(player.poste));
          const emptyClubs = clubs.filter(club => !players.some(player => player.club === club.nom));
          if (incomplete.length || invalidPositions.length || emptyClubs.length) {
            throw new Error("Données joueurs à corriger : " + incomplete.length +
              " joueur(s) incomplet(s), " + invalidPositions.length +
              " poste(s) invalide(s), " + emptyClubs.length + " club(s) sans joueur.");
          }

          console.log("OK — " + clubs.length + " clubs et " + players.length +
            " joueurs : liens, champs obligatoires et postes vérifiés.");
          NODE

      - name: Test player training safety
        run: |
          node --check players.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const source = fs.readFileSync("players.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__PlayerClassForTests = Player;");
          const PlayerForTests = globalThis.__PlayerClassForTests;
          const player = new PlayerForTests({
            age: 20,
            attributes: { speed: 98.95, goalkeeper: { reflexes: 10 } }
          });

          const goalkeeperBefore = JSON.stringify(player.attributes.goalkeeper);
          if (player.train("goalkeeper", 1) !== false) {
            throw new Error("L'entraînement a accepté un attribut gardien imbriqué.");
          }
          if (JSON.stringify(player.attributes.goalkeeper) !== goalkeeperBefore) {
            throw new Error("L'objet des attributs gardien a été altéré.");
          }
          if (player.train("speed", 1) !== true || player.attributes.speed !== 99) {
            throw new Error("L'entraînement numérique ou la limite de 99 est incorrect.");
          }
          if (player.train("unknown", 1) !== false) {
            throw new Error("L'entraînement a accepté un attribut inconnu.");
          }

          const previousSpeed = player.attributes.speed;
          player.developPotential();
          if (!Number.isFinite(player.attributes.speed) ||
              typeof player.attributes.goalkeeper !== "object" ||
              player.attributes.speed < previousSpeed) {
            throw new Error("Le développement du potentiel a corrompu les attributs.");
          }

          console.log("OK — entraînement numérique, limites d'attributs et attributs gardien préservés.");
          NODE

      - name: Test save and tactics round-trip
        run: |
          node --check saves/save.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const storage = new Map();
          globalThis.localStorage = {
            setItem: (key, value) => storage.set(key, String(value)),
            getItem: key => storage.has(key) ? storage.get(key) : null,
            removeItem: key => storage.delete(key)
          };
          const source = fs.readFileSync("saves/save.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__SaveManagerForTests = SaveManager;");
          const SaveManagerForTests = globalThis.__SaveManagerForTests;
          const saves = new SaveManagerForTests();

          const originalTactics = {
            formation: "4-3-3",
            currentTactic: "Équilibrée",
            lineup: [{ id: "p1", prenom: "Test", nom: "Titulaire" }],
            substitutes: [{ id: "p2", prenom: "Test", nom: "Remplaçant" }],
            roles: { p1: "Capitaine" },
            positions: { p1: "BU_1" },
            style: { mentality: "Équilibrée", pressing: 55, tempo: 60, possession: 50 }
          };
          const serialized = saves.getTacticsData(originalTactics);
          const restored = {};
          if (!saves.loadTacticsData(restored, JSON.parse(JSON.stringify(serialized)))) {
            throw new Error("La restauration tactique a échoué.");
          }
          for (const key of ["formation", "currentTactic", "lineup", "substitutes", "roles", "positions", "style"]) {
            if (JSON.stringify(restored[key]) !== JSON.stringify(originalTactics[key])) {
              throw new Error("La donnée tactique n'a pas été restaurée : " + key);
            }
          }

          const gameData = {
            club: { name: "Test FC" },
            tactics: serialized,
            currentMatchday: 4,
            calendar: [{ day: 4, played: true }],
            players: [{ id: "p1", fatigue: 37, forme: 82 }]
          };
          if (!saves.saveGame(1, gameData)) throw new Error("La sauvegarde n'a pas été enregistrée.");
          const loaded = saves.loadGame(1);
          if (!loaded || loaded.game.club.name !== "Test FC" ||
              loaded.game.currentMatchday !== 4 ||
              loaded.game.players[0].fatigue !== 37 ||
              loaded.game.tactics.lineup[0].id !== "p1") {
            throw new Error("Les données de carrière ne survivent pas au cycle sauvegarde/chargement.");
          }

          console.log("OK — composition, remplaçants, rôles, positions, style et données de carrière restaurés.");
          NODE

      - name: Test post-match fatigue, form, recovery and injuries
        run: |
          node --check ui/ui.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          globalThis.game = {
            club: { name: "Test FC" },
            manager: { season: 1 },
            currentMatchday: 1,
            tactics: { lineup: [{ id: "starter" }] },
            players: [
              { id: "starter", fatigue: 30, energy: 100, forme: 70, joursBlessure: 0, blessure: "" },
              { id: "reserve", fatigue: 25, energy: 90, forme: 65, joursBlessure: 0, blessure: "" },
              { id: "injured", fatigue: 50, energy: 70, forme: 55, joursBlessure: 2, blessure: "Blessure" }
            ]
          };
          const source = fs.readFileSync("ui/ui.js", "utf8");
          vm.runInThisContext(source + "\n;globalThis.__UITestClass = UI;");
          const UITestClass = globalThis.__UITestClass;
          const ui = Object.create(UITestClass.prototype);
          const originalRandom = Math.random;
          Math.random = () => 0.99;
          try {
            ui.applyPostMatchPlayerCondition({
              homeTeam: "Test FC", awayTeam: "Rival FC", homeGoals: 2, awayGoals: 0
            });
          } finally {
            Math.random = originalRandom;
          }

          const [starter, reserve, injured] = game.players;
          if (starter.fatigue !== 50 || starter.energy !== 88.75 || starter.forme !== 72) {
            throw new Error("La fatigue, l'énergie ou la forme du titulaire n'a pas évolué correctement.");
          }
          if (reserve.fatigue !== 10 || reserve.energy !== 100 || reserve.forme !== 65) {
            throw new Error("La récupération du remplaçant est incorrecte.");
          }
          if (injured.joursBlessure !== 1 || injured.fatigue !== 32 || injured.energy !== 88) {
            throw new Error("La durée de blessure ou la récupération du joueur blessé est incorrecte.");
          }
          console.log("OK — progression du titulaire, récupération des remplaçants et décrément des blessures.");
          NODE

      - name: Generate build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the GitHub Pages deployment run number for this exact commit.
          for attempt in {1..10}; do
            PAGES_BUILD=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" | jq -r --arg sha "${GITHUB_SHA}" '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha)] | first | .run_number // empty')
            if [ -n "${PAGES_BUILD}" ]; then break; fi
            sleep 2
          done
          # Fallback only if GitHub has not exposed the Pages run yet.
          BUILD_NUMBER="${PAGES_BUILD:-${GITHUB_RUN_NUMBER}}"
          printf 'window.MANAGER_BUILD_NUMBER = "%s";\n' "${BUILD_NUMBER}" > build-version.js

      - name: Validate build resources and JavaScript syntax
        run: |
          # Every script referenced by index.html must exist in the published artifact.
          grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)".*/\1/' | while IFS= read -r resource; do
            if [ ! -f "$resource" ]; then
              echo "::error::Missing script referenced by index.html: $resource"
              exit 1
            fi
          done

          # Catch syntax errors across the full JavaScript source tree.
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' ! -path './.git/*' -print)

          # Keep the key new modules explicitly present in the page.
          for resource in build-version.js ui/playerUI.js ui/squadUI.js ui/tacticsUI.js game/calendar.js matches.js standings.js players.js; do
            grep -Fq "src=\"$resource\"" index.html || {
              echo "::error::Expected module is not referenced by index.html: $resource"
              exit 1
            }
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
